name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '47 5 * * *'   # 05:47 UTC; off the full hour, when GitHub drops fewer scheduled runs
  workflow_dispatch:

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  REPORT_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/

jobs:
  tests:
    name: API, UI and BDD tests
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Java 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      # Chrome is preinstalled on GitHub-hosted Ubuntu runners; Selenium Manager resolves the driver.
      # The tested application is a public demo app, so one retry absorbs network hiccups.
      # Failed attempts stay visible in the Allure report.
      - name: Run tests
        run: mvn -B clean test -Dheadless=true -Dretry.count=1

      - name: Generate Allure report
        if: always()
        run: mvn -B allure:report

      - name: Add report link to the run summary
        if: always()
        run: |
          echo "### Allure report" >> "$GITHUB_STEP_SUMMARY"
          echo "- Latest report from \`main\`: ${{ env.REPORT_URL }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Report of this run: download the \`allure-report\` artifact below" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload report for GitHub Pages
        if: always() && github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v5
        with:
          path: target/site/allure-maven-plugin

      - name: Upload Allure report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: allure-report
          path: target/site/allure-maven-plugin
          if-no-files-found: warn
          retention-days: 14

      - name: Upload Allure results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: allure-results
          path: target/allure-results
          if-no-files-found: warn
          retention-days: 14

      # Screenshots are taken only for failed UI test attempts
      - name: Upload failure screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: screenshots
          path: target/allure-results/*.png
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload test logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: surefire-reports
          path: target/surefire-reports
          if-no-files-found: warn
          retention-days: 14

  # Publishes the Allure report of the main branch to GitHub Pages, also when tests fail.
  publish-report:
    name: Publish Allure report
    needs: tests
    if: always() && needs.tests.result != 'cancelled' && github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
