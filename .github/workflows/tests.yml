name: Tests

on:
  push:
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  tests:
    name: API, UI and BDD tests
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Java 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      # Chrome is preinstalled on GitHub-hosted Ubuntu runners; Selenium Manager resolves the driver.
      # The tested application is a public demo app, so one retry absorbs network hiccups.
      # Failed attempts stay visible in the Allure report.
      - name: Run tests
        run: mvn -B clean test -Dheadless=true -Dretry.count=1

      - name: Generate Allure report
        if: always()
        run: mvn -B allure:report

      - name: Upload Allure report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: allure-report
          path: target/site/allure-maven-plugin
          if-no-files-found: warn
          retention-days: 14

      - name: Upload Allure results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: allure-results
          path: target/allure-results
          if-no-files-found: warn
          retention-days: 14

      # Screenshots are taken only for failed UI test attempts
      - name: Upload failure screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: screenshots
          path: target/allure-results/*.png
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload test logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: surefire-reports
          path: target/surefire-reports
          if-no-files-found: warn
          retention-days: 14
